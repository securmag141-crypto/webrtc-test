<!DOCTYPE html>
<html>
<head>
    <title>WebRTC Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .user { background: #f0f0f0; padding: 10px; margin: 5px; }
        button { margin: 5px; padding: 10px; }
        #localVideo, #remoteVideo { width: 300px; }
    </style>
</head>
<body>
    <h2>WebRTC Audio Test</h2>
    
    <div>
        <h3>Твой ID: <span id="myId">-</span></h3>
        <button onclick="start()">🎤 Начать</button>
        <button onclick="callUser()">📞 Позвонить</button>
        <button onclick="hangup()">❌ Завершить</button>
    </div>
    
    <div>
        <h3>Онлайн:</h3>
        <div id="users"></div>
    </div>
    
    <div>
        <audio id="localAudio" controls></audio>
        <audio id="remoteAudio" controls></audio>
    </div>
    
   <script src="/socket.io/socket.io.js"></script>
<script>
    let socket;
    let peerConnection;
    let localStream;
    let remoteStream;
    let myId = 'user_' + Math.random().toString(36).substr(2, 9);
    
    async function start() {
        // Подключаемся к серверу
        socket = io();
        socket.emit('register', myId);
        document.getElementById('myId').textContent = myId;
        
        // Запрашиваем микрофон
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                audio: true 
            });
            document.getElementById('localAudio').srcObject = localStream;
            console.log('✅ Микрофон подключен');
        } catch(err) {
            console.error('❌ Ошибка микрофона:', err);
            alert('Нет доступа к микрофону');
            return;
        }
        
        // Обработка входящих звонков
        socket.on('call:incoming', async (data) => {
            if (confirm(`${data.caller} звонит. Принять?`)) {
                await acceptCall(data);
            } else {
                socket.emit('call:end', { to: data.from });
            }
        });
        
        socket.on('call:answered', async (data) => {
            if (peerConnection) {
                await peerConnection.setRemoteDescription(
                    new RTCSessionDescription(data.answer)
                );
                console.log('✅ Звонок принят');
            }
        });
        
        socket.on('call:ice', (data) => {
            if (peerConnection) {
                peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });
        
        socket.on('call:ended', () => {
            console.log('❌ Звонок завершен');
            hangup();
            alert('Собеседник завершил звонок');
        });
    }
    
    function callUser() {
        const targetId = prompt('Введите ID пользователя для звонка:');
        if (!targetId) return;
        
        // Создаем PeerConnection с ICE серверами
        peerConnection = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        });
        
        // Добавляем локальный поток
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });
        
        // Получаем удаленный поток
        peerConnection.ontrack = (event) => {
            console.log('🎧 Получен удаленный поток');
            remoteStream = event.streams[0];
            document.getElementById('remoteAudio').srcObject = remoteStream;
        };
        
        // ICE кандидаты
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('call:ice', {
                    to: targetId,
                    candidate: event.candidate
                });
            }
        };
        
        // Создаем оффер
        peerConnection.createOffer()
            .then(offer => peerConnection.setLocalDescription(offer))
            .then(() => {
                socket.emit('call:offer', {
                    to: targetId,
                    offer: peerConnection.localDescription,
                    caller: myId
                });
                console.log('📞 Звонок отправлен');
            })
            .catch(err => console.error('Ошибка звонка:', err));
    }
    
    async function acceptCall(data) {
        // Создаем PeerConnection
        peerConnection = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        });
        
        // Добавляем локальный поток
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => {
            peerConnection.addTrack(track, stream);
        });
        
        // Получаем удаленный поток
        peerConnection.ontrack = (event) => {
            console.log('🎧 Получен удаленный поток');
            remoteStream = event.streams[0];
            document.getElementById('remoteAudio').srcObject = remoteStream;
        };
        
        // ICE кандидаты
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('call:ice', {
                    to: data.from,
                    candidate: event.candidate
                });
            }
        };
        
        // Устанавливаем удаленный оффер
        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(data.offer)
        );
        
        // Создаем ответ
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        
        // Отправляем ответ
        socket.emit('call:answer', {
            to: data.from,
            answer: answer
        });
        
        console.log('✅ Звонок принят');
    }
    
    function hangup() {
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        if (remoteStream) {
            document.getElementById('remoteAudio').srcObject = null;
            remoteStream = null;
        }
        console.log('❌ Звонок завершен');
    }
</script>
</body>
</html>
